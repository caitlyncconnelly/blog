.home-grid {
  width: 900px;

.home-grid img {

}

/* center portrait */
.portrait {
  grid-column: span 2;
  max-width: 300px;
}

/* ABOUT centered under portrait */
.about {
  grid-column: span 2;
}

a img:hover {
  transform: scale(1.05);
}

</style>
  <script>
    function initCounter() {
      var hits = localStorage.getItem("retro-site-hits");
      hits = hits ? parseInt(hits) + 1 : 1;
      localStorage.setItem("retro-site-hits", hits);
      var formatted = ("000000" + hits).slice(-6);
      document.getElementById("hitCounter").innerHTML = formatted;
      document.getElementById("visitorNumber").innerHTML = formatted;
    }

    window.onload = function() {
      initCounter();
    };
  </script>

<script>
  function showLatestComic() {
    if (!comics || comics.length === 0) return;

    const latest = comics[0];

    document.getElementById("latest-comic").innerHTML = `
      <div style="margin-bottom:40px;">
        <h3>${latest.title}</h3>
        <p><font size="2">${latest.date}</font></p>
        <a href="comics.html">
          <img src="comics/${latest.file}" width="600">
        </a>
      </div>
    `;
  }

  showLatestComic();
</script>
