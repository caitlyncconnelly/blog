<!DOCTYPE html>
<html>
<head>
  <title>cc.com.net</title>
  <meta charset="UTF-8">
<style>

.home-grid {
  width: 800px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: max-content 2fr max-content;
  grid-template-rows: auto auto auto;
  gap: 5px 10px; /* first value is row gap, second is column gap */
  justify-items: center;
  align-items: start; /* change from center to start */
}

.home-grid img {
  max-width: 170px;
}

/* Portrait spans rows 1-2 so it sits centered between top and side buttons */
.portrait {
  grid-column: 2;
  grid-row: 1 / 3;
  max-width: 600px !important; /* overrides the rule above */
  width: 100%;
}

/* Place each button explicitly */
.btn-comics    { grid-column: 1; grid-row: 1; }
.btn-blog      { grid-column: 3; grid-row: 1; }
.btn-stories   { grid-column: 1; grid-row: 2; }
.btn-sketchbook{ grid-column: 3; grid-row: 2; }
.btn-about     { grid-column: 2; grid-row: 3; }

a img:hover {
  transform: scale(1.05);
}

/* Newsletter form */
.embeddable-buttondown-form {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 10px auto;
  font-size: 0.72rem;
}

.embeddable-buttondown-form input[type="email"] {
  width: 150px;
  padding: 3px 6px;
  font-size: 0.72rem;
}

.embeddable-buttondown-form input[type="submit"] {
  padding: 3px 10px;
  font-size: 0.72rem;
  cursor: pointer;
}

/* Footer */
.footer {
  text-align: center;
  font-size: 0.75rem;
  padding: 16px;
  margin-top: 10px;
  color: #555;
}

</style>
 
</head>
<center>

<h1 style="margin-top:40px;">C.C. Connelly</h1>

<div class="home-grid">

  <a href="comics.html" class="btn-comics">
    <img src="images/comics-button.png">
  </a>

  <a href="blog.html" class="btn-blog">
    <img src="images/blog-button.png">
  </a>

  <img src="images/selfportrait.png" class="portrait">

  <a href="stories.html" class="btn-stories">
    <img src="images/stories-button.png">
  </a>

  <a href="sketchbook.html" class="btn-sketchbook">
    <img src="images/sketchbook-button.png">
  </a>

  <a href="about.html" class="btn-about">
    <img src="images/about-button.png">
  </a>

</div>

</center>

<iframe name="bd-hidden" style="display:none;"></iframe>

<form
  action="https://buttondown.com/api/emails/embed-subscribe/ccconnelly"
  method="post"
  target="bd-hidden"
  class="embeddable-buttondown-form"
  referrerpolicy="unsafe-url"
  onsubmit="handleSubscribe(event)"
>
  <label for="bd-email">Get comics straight to your e-mail</label>
  <input type="email" name="email" id="bd-email" placeholder="your@email.com" required />
  <input type="submit" value="Subscribe" />
  <p id="bd-message" style="display:none; font-size:0.85rem; color:green;">Thanks for subscribing! Check your inbox to confirm. ✉️</p>
</form>

<script>
  function handleSubscribe(e) {
    setTimeout(function() {
      document.getElementById("bd-message").style.display = "block";
      document.getElementById("bd-email").value = "";
    }, 500);
  }
</script>

<div class="footer">
  © 1998 Caitlyn | This site is ALWAYS under construction
</div>
 
</body>
</html>
