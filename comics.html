<!DOCTYPE html>
<html>
<head>
  <title>Caitlyn's Cool Site - Comics</title>
  <meta charset="UTF-8">

  <script>
    function initCounter() {
      var hits = localStorage.getItem("retro-site-hits");
      hits = hits ? parseInt(hits) + 1 : 1;
      localStorage.setItem("retro-site-hits", hits);
      var formatted = ("000000" + hits).slice(-6);
      document.getElementById("hitCounter").innerHTML = formatted;
      document.getElementById("visitorNumber").innerHTML = formatted;
    }

    window.onload = function() {
      initCounter();
      renderComics();
    };
  </script>
</head>

<body bgcolor="#000099" style="padding:20px;">
<center>

<table width="760" border="3" cellpadding="10" cellspacing="0" bgcolor="#ffffff">

  <!-- HEADER -->
  <tr>
    <td colspan="2" bgcolor="#ffccff" align="center">
      <h1>
        <font face="Comic Sans MS" color="#0000ff">
          CAITLYN'S COOL SITE
        </font>
      </h1>
      <blink>Best viewed in 1024x768</blink>
    </td>
  </tr>

  <tr>

    <!-- SIDEBAR -->
    <td width="150" valign="top" bgcolor="#ccffff">
      <b>Navigation</b><br><br>

      <a href="index.html">Home</a><br><br>
      <a href="comics.html">Comics</a><br><br>
      <a href="stories.html">Short Stories</a><br><br>
      <a href="blog.html">Blog</a><br><br>
      <a href="about.html">About</a><br><br>

      <hr>

      <b>Visitor Counter</b><br>
      <table border="2" cellpadding="5" bgcolor="#000000">
        <tr>
          <td>
            <font color="#00ff00" face="Courier New" size="4" id="hitCounter">
              000000
            </font>
          </td>
        </tr>
      </table>
      <br>
      You are visitor #<span id="visitorNumber">000000</span>
    </td>

    <!-- MAIN CONTENT -->
    <td valign="top" bgcolor="#ffffff">

      <h2><font color="#ff00cc">MY COMICS</font></h2>
      <hr>

      <div id="comic-container"></div>

      <center>
        <br>
        <button onclick="prevPage()">Previous</button>
        <span id="page-number"></span>
        <button onclick="nextPage()">Next</button>
      </center>

    </td>
  </tr>

  <!-- FOOTER -->
  <tr>
    <td colspan="2" align="center" bgcolor="#ffccff">
      <font size="2">
        © 2003 Caitlyn | This site is ALWAYS under construction
      </font>
    </td>
  </tr>

</table>

</center>

<script src="comics-data.js"></script>

<script>

  const comicsPerPage = 5;
  let currentPage = 1;

  function renderComics() {
    const container = document.getElementById("comic-container");
    container.innerHTML = "";

    const start = (currentPage - 1) * comicsPerPage;
    const end = start + comicsPerPage;
    const pageComics = comics.slice(start, end);

    pageComics.forEach(comic => {
      container.innerHTML += `
        <div style="margin-bottom:40px;">
          <h3>${comic.title}</h3>
          <p><font size="2">${comic.date}</font></p>
          <img src="comics/${comic.file}" width="600">
        </div>
      `;
    });

    document.getElementById("page-number").innerText =
      "Page " + currentPage + " of " + Math.ceil(comics.length / comicsPerPage);
  }

  function nextPage() {
    if (currentPage < Math.ceil(comics.length / comicsPerPage)) {
      currentPage++;
      renderComics();
    }
  }

  function prevPage() {
    if (currentPage > 1) {
      currentPage--;
      renderComics();
    }
  }

</script>

</body>
</html>
